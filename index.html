<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Earth</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: 'Press Start 2P', monospace;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
            image-rendering: pixelated;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <!-- Hidden element to force font load before canvas draws -->
    <div style="font-family: 'Press Start 2P'; position: absolute; left: -9999px;">loading font</div>

    <div id="game-container">
        <!-- Main game canvas -->
        <canvas id="gameCanvas"></canvas>
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
